<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Appointment Rescheduled</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%); padding: 32px 24px; text-align: center; color: #ffffff; }
    .content { padding: 32px 28px; line-height: 1.6; }
    .card { background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 12px; padding: 18px; margin: 20px 0; }
    .footer { padding: 20px 28px; background: #f1f5f9; text-align: center; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏥 MediBook</h1>
    </div>
    <div class="content">
      <h2>Appointment Rescheduled</h2>
      <p>Hello <span th:text="${name}">User</span>,</p>
      <p>Your appointment with <strong th:text="${otherPartyName}">Doctor</strong> has been updated to the following new time:</p>
      <div class="card">
        <p><strong>Reference:</strong> <span th:text="${referenceNo}">MB-1234</span></p>
        <p><strong>New Slot Time:</strong> <span th:text="${newDateTime}">Oct 26, 2026 at 11:00 AM</span></p>
      </div>
    </div>
    <div class="footer">
      &copy; MediBook Hospital Appointment System. All rights reserved.
    </div>
  </div>
</body>
</html>
