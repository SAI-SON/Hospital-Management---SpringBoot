services:
  postgres:
    image: postgres:16-alpine
    container_name: medibook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Hospital}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papuchellakutty12345}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medibook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibook_user} -d ${POSTGRES_DB:-medibook_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medibook-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medibook-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medibook.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medibook-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: medibook-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP port
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI for emails
    networks:
      - medibook-network

volumes:
  medibook_pgdata:
    driver: local

networks:
  medibook-network:
    driver: bridge
